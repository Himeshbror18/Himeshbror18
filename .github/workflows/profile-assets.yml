name: Generate Profile Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_profile_assets.mjs"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate local stats, languages and trophies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: Himeshbror18
        run: node .github/scripts/generate_profile_assets.mjs

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/profile-languages.svg assets/profile-trophies.svg
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Update profile metrics"
            git push
          fi
