<svg width="380" height="280" viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>TaigaRig logo</title>
<desc>Circuit-trace tiger stripe mark with soft offset shadow, blue gradient, and glowing via, paired with the wordmark taigarig</desc>
<rect width="380" height="280" fill="#FFFFFF"/>
<defs>
<linearGradient id="traceFade" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#5B96FF"/>
<stop offset="100%" stop-color="#1E4FCC"/>
</linearGradient>
<style>@keyframes taigaPulse{0%,100%{opacity:.82}50%{opacity:1;filter:drop-shadow(0 0 5px #2E6BE6)}}</style></defs>
<g transform="translate(190,115)" style="animation:taigaPulse 3s ease-in-out infinite">
<path d="M -46 -33 L -18 -33 L -18 -9 L 10 -9 L 10 16 L 38 16 L 38 34" stroke="#101114" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.12" transform="translate(5,6)"/>
<path d="M -46 -33 L -18 -33 L -18 -9 L 10 -9 L 10 16 L 38 16 L 38 34" stroke="url(#traceFade)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="-46" cy="-33" r="7" fill="#101114"/>
<circle cx="-46" cy="-33" r="10" fill="none" stroke="#2E6BE6" stroke-width="1.5" opacity="0.4"/>
<circle cx="38" cy="34" r="7" fill="#101114"/>
<circle cx="-18" cy="-9" r="3" fill="#2E6BE6"/>
<circle cx="10" cy="16" r="3" fill="#2E6BE6"/>
</g>
<text x="190" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="0.3" fill="#101114">taiga<tspan fill="#2E6BE6">rig</tspan></text>
</svg>