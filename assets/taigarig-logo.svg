<svg width="380" height="280" viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>TaigaRig animated logo</title>
<desc>Two glowing dots travel down a blue circuit-like staircase, then a tiger appears above the TaigaRig wordmark.</desc>
<defs>
  <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5B96FF"/><stop offset="1" stop-color="#1E4FCC"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="route" d="M144 82H172V106H200V130H228V154"/>
  <style>
    .route{fill:none;stroke:url(#trace);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .shadow{fill:none;stroke:#101114;stroke-opacity:.12;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
    .runner{fill:#101114;filter:url(#glow)}
    .tiger{opacity:0;transform-origin:190px 95px;animation:tigerIn 5s ease-in-out infinite}
    .tigerMark{fill:#101114}
    .stripe{stroke:#2E6BE6;stroke-width:5;stroke-linecap:round}
    @keyframes tigerIn{0%,55%{opacity:0;transform:scale(.75)}65%,88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.75)}}
  </style>
</defs>

<!-- transparent background; only logo artwork and shadows -->
<g>
  <use href="#route" class="shadow" transform="translate(5 6)"/>
  <use href="#route" class="route"/>
  <!-- second runner follows the first, both travel down the steps -->
  <circle class="runner" r="6">
    <animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </circle>
  <circle class="runner" r="4.5" opacity=".72">
    <animateMotion dur="2.4s" begin=".28s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
  </circle>
  <circle cx="144" cy="82" r="6" fill="#101114"/>
  <circle cx="228" cy="154" r="6" fill="#101114"/>

  <!-- tiger reveal after the runners reach the bottom -->
  <g class="tiger">
    <path class="tigerMark" d="M174 103c-10-8-13-20-8-29l-8-10 14 3c6-9 14-14 25-14s19 5 25 14l14-3-8 10c5 9 2 21-8 29l-6 5h-28z"/>
    <path d="M170 76l9 5m-3-12 9 9m18-9-9 9m13-4-9 5" class="stripe" fill="none"/>
    <circle cx="184" cy="82" r="3" fill="#fff"/><circle cx="196" cy="82" r="3" fill="#fff"/>
    <circle cx="184" cy="82" r="1.5" fill="#101114"/><circle cx="196" cy="82" r="1.5" fill="#101114"/>
    <path d="M187 91q3 3 6 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</g>

<text x="190" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="600" letter-spacing=".3" fill="#101114">taiga<tspan fill="#2E6BE6">rig</tspan></text>
</svg>