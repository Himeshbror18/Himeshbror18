<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">HB profile scene</title>
<desc id="desc">A calm anime-inspired workspace overlooking a blue-lavender sky and distant mountains, with a small HB signature on a notebook.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9d8f7"/><stop offset=".58" stop-color="#d9d0f1"/><stop offset="1" stop-color="#f9e7d5"/></linearGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
  <linearGradient id="desk" x2="1" y2="0"><stop stop-color="#b78c79"/><stop offset="1" stop-color="#dfbba0"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff7d9" stop-opacity=".95"/><stop offset="1" stop-color="#ffd9ba" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1400" height="520" rx="30" fill="url(#sky)"/>
<circle cx="1030" cy="170" r="150" fill="url(#sun)" filter="url(#blur)"/>
<!-- window frame -->
<rect x="48" y="34" width="1304" height="380" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".48" stroke-width="3"/>
<path d="M705 34V414M48 244H1352" stroke="#ffffff" stroke-opacity=".42" stroke-width="4"/>
<!-- distant mountains -->
<path d="M48 300L190 238L300 290L450 190L585 286L730 215L855 300L1000 218L1120 276L1235 190L1352 248V414H48Z" fill="#8891bd" opacity=".42"/>
<path d="M48 332L220 275L355 320L500 250L655 327L795 265L930 330L1090 264L1230 315L1352 255V414H48Z" fill="#637092" opacity=".35"/>
<!-- city -->
<g fill="#5d6788" opacity=".34">
<path d="M60 410v-52h24v52h18v-82h28v82h18v-42h27v42h20v-106h34v106h24v-56h22v56h30v-75h26v75h24v-46h27v46z"/>
<path d="M980 410v-44h18v44h25v-72h25v72h20v-52h23v52h24v-94h31v94h20v-60h25v60h26v-39h18v39h26v-78h30v78h20v-50h28v50h25v-88h30v88z"/>
</g>
<!-- foreground desk -->
<rect x="0" y="414" width="1400" height="106" fill="url(#desk)"/>
<rect x="0" y="414" width="1400" height="8" fill="#8d685e" opacity=".45"/>
<!-- notebook -->
<g transform="translate(820 390) rotate(-5)">
<rect x="0" y="0" width="220" height="72" rx="8" fill="#f7f0e5" stroke="#aa9181" stroke-width="2"/>
<path d="M18 18H202M18 34H202M18 50H150" stroke="#c6b5aa" stroke-opacity=".6"/>
<text x="162" y="47" font-family="cursive" font-size="20" fill="#6c5a72">HB</text>
</g>
<!-- mug -->
<g transform="translate(1080 367)"><rect x="0" y="0" width="74" height="55" rx="10" fill="#efe3dc"/><path d="M73 13h18c24 0 24 30 0 30H74" fill="none" stroke="#b79896" stroke-width="8"/><path d="M18 -5c-8-22 14-23 5-42M42 -5c-8-22 14-23 5-42" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/></g>
<!-- plant -->
<g transform="translate(1190 324)"><path d="M20 92h92l-12 90H32Z" fill="#d0b5a6"/><path d="M66 92V8M66 55C26 30 18 8 24-12M66 68C112 47 123 20 116-3M66 48C48 21 48 0 58-19" fill="none" stroke="#678c73" stroke-width="10" stroke-linecap="round"/></g>
<!-- paper plane -->
<path d="M410 120L570 88L505 152L480 128L410 120Z" fill="#ffffff" fill-opacity=".48" stroke="#7181aa" stroke-opacity=".35" stroke-width="2"/>
<path d="M480 128L505 152L512 122" fill="#ffffff" fill-opacity=".32" stroke="#7181aa" stroke-opacity=".25"/>
<!-- tiny ambient marks -->
<g fill="#ffffff" opacity=".7"><circle cx="260" cy="94" r="3"/><circle cx="360" cy="160" r="2"/><circle cx="1180" cy="124" r="3"/><circle cx="1260" cy="82" r="2"/></g>
<g fill="#60708f" opacity=".72" font-family="ui-monospace,SFMono-Regular,monospace"><text x="76" y="82" font-size="13" letter-spacing="4">HB / FIELD NOTES</text><text x="76" y="112" font-size="12" letter-spacing="2">a desk, a window, too many ideas</text></g>
</svg>
