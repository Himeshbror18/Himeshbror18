<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="t d">
<title id="t">Asymmetric code palette</title><desc id="d">Python, C++, and TypeScript arranged as overlapping circles with editorial annotations.</desc>
<rect width="1100" height="360" rx="28" fill="#f6f0e6"/>
<rect x="0" y="0" width="1100" height="74" fill="#19171c"/>
<text x="52" y="47" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="5" fill="#f6f0e6">CODE / IN ROTATION</text>
<rect x="900" y="0" width="200" height="74" fill="#c74754"/>
<text x="930" y="45" font-family="monospace" font-size="12" fill="#fff7ed" letter-spacing="2">NO RANKING</text>
<!-- orbit scaffolding -->
<g fill="none" stroke="#6e5b78" stroke-width="2" opacity=".42">
<ellipse cx="270" cy="195" rx="190" ry="88" transform="rotate(-13 270 195)"/>
<ellipse cx="545" cy="184" rx="172" ry="104" transform="rotate(10 545 184)"/>
<ellipse cx="820" cy="194" rx="188" ry="82" transform="rotate(-11 820 194)"/>
</g>
<!-- Python -->
<g transform="rotate(-8 270 190)">
<circle cx="250" cy="190" r="92" fill="#3979ae"/>
<circle cx="286" cy="220" r="45" fill="#f0c343"/>
<text x="250" y="202" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fff">Py</text>
<text x="286" y="225" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#4a3b19">01</text>
<path d="M159 125q70-44 135-11" fill="none" stroke="#fff7ed" stroke-width="3" opacity=".65"/>
<text x="165" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#25202b">Python</text>
<text x="165" y="328" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6c6470">automation · experiments</text>
</g>
<!-- C++ -->
<g transform="rotate(6 545 188)">
<circle cx="535" cy="178" r="98" fill="#4f3b72"/>
<circle cx="584" cy="136" r="39" fill="#c74754"/>
<text x="535" y="189" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fff">C++</text>
<text x="584" y="141" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fff">02</text>
<path d="M446 246q80 48 156 3" fill="none" stroke="#fff7ed" stroke-width="3" opacity=".55"/>
<text x="462" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#25202b">C++</text>
<text x="462" y="328" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6c6470">logic · systems</text>
</g>
<!-- TypeScript -->
<g transform="rotate(-5 815 190)">
<circle cx="820" cy="188" r="84" fill="#2f78b7"/>
<circle cx="860" cy="220" r="43" fill="#e5e0d7" stroke="#c74754" stroke-width="4"/>
<text x="820" y="199" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#fff">TS</text>
<text x="860" y="225" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#c74754">03</text>
<path d="M755 115q74-25 137 14" fill="none" stroke="#fff7ed" stroke-width="3" opacity=".6"/>
<text x="752" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#25202b">TypeScript</text>
<text x="752" y="328" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6c6470">web · interfaces</text>
</g>
<!-- annotation -->
<g font-family="monospace" font-size="11" fill="#6c6470">
<text x="55" y="112">notes // tools change</text>
<text x="926" y="112" transform="rotate(7 926 112)">still exploring</text>
<text x="950" y="330" transform="rotate(-8 950 330)">…</text>
</g>
</svg>