<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Current code palette</title><desc id="desc">An intentionally irregular palette of Python, C++, and TypeScript shown as overlapping painted circles.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffaf7"/><stop offset=".48" stop-color="#f4effb"/><stop offset="1" stop-color="#e8f6f4"/></linearGradient><radialGradient id="py"><stop stop-color="#4b91ca"/><stop offset="1" stop-color="#28608f"/></radialGradient><radialGradient id="cpp"><stop stop-color="#9d83c8"/><stop offset="1" stop-color="#6c4e99"/></radialGradient><radialGradient id="ts"><stop stop-color="#59a2b0"/><stop offset="1" stop-color="#34727c"/></radialGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".12"/></filter><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/></filter></defs><rect width="1100" height="360" rx="30" fill="url(#bg)"/><text x="52" y="55" fill="#475569" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700" letter-spacing="2">CURRENT CODE PALETTE</text><path d="M52 71h118" stroke="#b8a6df" stroke-width="3" stroke-linecap="round"/><text x="900" y="55" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12" letter-spacing="3">NO RANKING • JUST TOOLS</text><g filter="url(#shadow)" filter="url(#rough)"><circle cx="245" cy="190" r="92" fill="url(#py)" opacity=".96"/><circle cx="545" cy="158" r="98" fill="url(#cpp)" opacity=".95"/><circle cx="812" cy="212" r="88" fill="url(#ts)" opacity=".96"/></g><g fill="none" stroke-linecap="round" opacity=".55"><path d="M134 140q82-65 180 6t164-2" stroke="#6b7aa4" stroke-width="2"/><path d="M408 250q74-76 168-9t185-18" stroke="#8e78b5" stroke-width="2"/><path d="M705 127q54-38 120 4t117 0" stroke="#6aa5a0" stroke-width="2"/></g><g font-family="ui-sans-serif,system-ui" text-anchor="middle"><text x="245" y="196" fill="#fff" font-size="32" font-weight="800">Python</text><text x="245" y="226" fill="#edf7ff" font-size="13">automation • experiments</text><text x="545" y="164" fill="#fff" font-size="32" font-weight="800">C++</text><text x="545" y="194" fill="#f6f0ff" font-size="13">logic • systems</text><text x="812" y="218" fill="#fff" font-size="30" font-weight="800">TypeScript</text><text x="812" y="248" fill="#eefcfb" font-size="13">web • interfaces</text></g><g fill="#fff"><circle cx="160" cy="93" r="3" opacity=".65"/><circle cx="652" cy="72" r="3" opacity=".55"/><circle cx="980" cy="128" r="3" opacity=".65"/></g><path d="M136 304q126 20 252 0t252 0 252 0" fill="none" stroke="#b8a6df" stroke-opacity=".45" stroke-width="2"/><text x="550" y="334" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif,system-ui" font-size="14">different tools, same curiosity.</text></svg>