<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Current code palette</title><desc id="desc">A calm editorial palette presenting Python, C++ and TypeScript as three distinct tools.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset=".55" stop-color="#f5f1fb"/><stop offset="1" stop-color="#edf7f6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-opacity=".12"/></filter><linearGradient id="line" x2="1"><stop stop-color="#9aa8e8"/><stop offset=".5" stop-color="#e0a9b5"/><stop offset="1" stop-color="#8fc9c0"/></linearGradient></defs><rect width="1100" height="360" rx="30" fill="url(#paper)"/><text x="58" y="58" font-family="ui-sans-serif,system-ui" font-size="19" font-weight="600" fill="#334155">current code palette</text><text x="58" y="87" font-family="ui-sans-serif,system-ui" font-size="13" fill="#64748b">the tools I keep reaching for.</text><path d="M58 104H245" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/><g font-family="ui-sans-serif,system-ui" filter="url(#shadow)"><g transform="translate(58 125) rotate(-2 155 95)"><rect width="315" height="160" rx="24" fill="#fff" stroke="#e4e1eb"/><circle cx="62" cy="64" r="31" fill="#3776ab"/><text x="62" y="73" text-anchor="middle" font-size="20" font-weight="800" fill="#ffd343">Py</text><text x="110" y="59" font-size="23" font-weight="700" fill="#334155">Python</text><text x="110" y="84" font-size="13" fill="#64748b">automation · experiments</text><path d="M42 122h205" stroke="#3776ab" stroke-width="8" stroke-opacity=".14" stroke-linecap="round"/><circle cx="267" cy="123" r="6" fill="#3776ab" opacity=".55"/></g><g transform="translate(392 113) rotate(1.5 155 95)"><rect width="315" height="160" rx="24" fill="#fff" stroke="#e4e1eb"/><circle cx="62" cy="64" r="31" fill="#00599c"/><text x="62" y="72" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">C++</text><text x="110" y="59" font-size="23" font-weight="700" fill="#334155">C++</text><text x="110" y="84" font-size="13" fill="#64748b">logic · systems · hardware</text><path d="M42 122h205" stroke="#00599c" stroke-width="8" stroke-opacity=".14" stroke-linecap="round"/><circle cx="267" cy="123" r="6" fill="#00599c" opacity=".55"/></g><g transform="translate(725 128) rotate(-1 155 95)"><rect width="315" height="155" rx="24" fill="#fff" stroke="#e4e1eb"/><circle cx="62" cy="63" r="31" fill="#3178c6"/><text x="62" y="71" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">TS</text><text x="110" y="58" font-size="22" font-weight="700" fill="#334155">TypeScript</text><text x="110" y="83" font-size="13" fill="#64748b">interfaces · web</text><path d="M42 121h205" stroke="#3178c6" stroke-width="8" stroke-opacity=".14" stroke-linecap="round"/><circle cx="267" cy="122" r="6" fill="#3178c6" opacity=".55"/></g></g><text x="58" y="331" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#8a8499">PYTHON  /  C++  /  TYPESCRIPT</text></svg>