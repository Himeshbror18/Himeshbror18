<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d">
<title id="t">Abstract digital landscape</title>
<desc id="d">A minimal cinematic cyber landscape with a glowing horizon and geometric forms.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#070812"/>
    <stop offset=".58" stop-color="#10142a"/>
    <stop offset="1" stop-color="#071b24"/>
  </linearGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset=".5" stop-color="#67e8f9"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#222047"/>
    <stop offset="1" stop-color="#071820"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop stop-color="#c4b5fd" stop-opacity=".9"/>
    <stop offset=".18" stop-color="#67e8f9" stop-opacity=".35"/>
    <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="44" height="28" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V28" fill="none" stroke="#67e8f9" stroke-opacity=".07"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1400" height="360" rx="28" fill="url(#sky)"/>
<ellipse cx="1040" cy="205" rx="240" ry="170" fill="url(#sun)" filter="url(#blur)"/>
<path d="M0 285L210 210L330 270L520 150L700 275L880 175L1080 270L1260 135L1400 225V360H0Z" fill="url(#mountain)" opacity=".95"/>
<path d="M0 310L250 240L430 295L650 205L820 300L1060 215L1220 285L1400 190V360H0Z" fill="#080d19" opacity=".9"/>
<rect x="0" y="245" width="1400" height="115" fill="url(#grid)" opacity=".9"/>
<path d="M0 252H1400" stroke="url(#horizon)" stroke-width="2"/>
<path d="M0 278H1400M0 306H1400M0 336H1400" stroke="#67e8f9" stroke-opacity=".09"/>
<g fill="none" stroke="#a78bfa" stroke-opacity=".32">
 <path d="M1020 55h100l18 18h96l26 26h100"/>
