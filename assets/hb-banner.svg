<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d">
<title id="t">Cinematic digital horizon</title>
<desc id="d">A minimal dark cyber landscape with a violet and cyan horizon, geometric mountains and subtle perspective grid.</desc>
